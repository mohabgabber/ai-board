name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: service/go.sum
      - name: Python writer tests
        run: python -m unittest -v test_board
      - name: Viewer refresh tests
        run: node --test test_refresh.cjs
      - name: Go host tests
        working-directory: service
        run: go test ./...
